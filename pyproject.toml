[project]
name = "laboratorio-8-fidelizacion"
version = "1.0.0"
description = "Programa de fidelización en restaurantes con RabbitMQ (CS3081)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pika>=1.3.2",
    "pydantic>=2.9.0",
    "email-validator>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "pylint>=3.3.0",
    "radon>=6.0.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: prueba contra RabbitMQ real (requiere .env y broker del curso)",
]

[tool.pylint.main]
jobs = 0
py-version = "3.11"
init-hook = 'import sys; sys.path.insert(0, "src")'

[tool.pylint.messages_control]
disable = ["too-few-public-methods", "missing-module-docstring"]

[tool.pylint.format]
max-line-length = 100

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
fail_under = 95
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]
